name: Bug report
description: Report a reproducible AtlasHybrid defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report production data, secrets, or personal server worlds.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: AtlasHybrid, Minecraft, Forge, and Java versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal clean-server steps, plugins, and mods
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
