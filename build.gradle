plugins {
    id 'base'
}

ext {
    atlasVersion = '0.1.0-alpha'
    minecraftVersion = '1.19.2'
    forgeVersion = '43.5.0'
}

allprojects {
    group = 'dev.atlashybrid'
    version = rootProject.ext.atlasVersion

    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 17
            options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

gradle.projectsEvaluated {
    subprojects.each { targetProject ->
        def reobfTask = targetProject.tasks.findByName('reobfJar')
        if (reobfTask != null) {
            def jarTask = targetProject.tasks.named('jar', Jar)

            // ForgeGradle rewrites its jar after the Jar task, including ZIP timestamps.
            def normalizeReobfuscatedJar = targetProject.tasks.register('normalizeReobfuscatedJar', Zip) {
                archiveFileName.set(jarTask.flatMap { it.archiveFileName })
                destinationDirectory.set(targetProject.layout.buildDirectory.dir('reproducible-archives'))
                from { targetProject.zipTree(jarTask.get().archiveFile.get().asFile) }

                doLast {
                    targetProject.copy {
                        from archiveFile
                        into jarTask.get().destinationDirectory
                    }
                }
            }

            reobfTask.finalizedBy normalizeReobfuscatedJar
        }
    }
}

tasks.register('proofArtifacts') {
    group = 'build'
    description = 'Builds the AtlasHybrid runtime, test plugin, and test mod proof artifacts.'
    dependsOn ':platform-forge-1.19.2:build', ':test-plugin:build', ':test-mod:build'
}
